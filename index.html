<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sokay</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            background-color: #F2C89B;
        }

        header {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 0 10px;
        }

        header img {
            max-width: 300px;
            width: 80%;
            height: auto;
            display: block;
            mix-blend-mode: multiply;
        }

        main {
            padding: 20px;
            text-align: center;
            color: #5C4433;
        }

        main p {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 0.9rem;
            max-width: 500px;
            margin: -10px auto 0;
            line-height: 1.6;
        }

        .video-wrap {
            display: flex;
            justify-content: center;
            padding: 20px 0 40px;
        }

        .video-wrap video {
            width: 600px;
            height: 300px;
            object-fit: cover;
        }

        /* ADD THE NEW CODE HERE */
        .memory-link {
            display: flex;
            justify-content: center;
            padding-bottom: 40px;
        }
        .memory-button {
            background-color: black;
            color: lightcyan;
            border: none;
            border-radius: 10px;
            padding: 12px 24px;
            font-size: 1rem;
            cursor: pointer;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital@1&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <img src="Sokay.png" alt="Sokay">

    <main>
        <p>Every moment leaves behind its own colours — different shades of life, kept through every chapter.</p>
    </main>

    <div class="video-wrap">

            <source src="Map.mp4" type="video/mp4">
            <source src="Map.webm" type="video/webm">
        </video>
    </div>

</a>
</body>
</html>
