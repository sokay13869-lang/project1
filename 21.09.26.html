<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>21.09.26 - Sokay</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,500&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            background-color: #F2C89B;
            color: #5C4433;
        }

        header {
            text-align: center;
            padding: 40px 20px 20px;
        }

        header img {
            max-width: 250px;
            width: 70%;
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-weight: normal;
            text-align: center;
            margin: 10px 0 10px;
            font-size: 1.8rem;
        }

        h1::after {
            content: "✦";
            display: block;
            font-size: 0.9rem;
            color: #a17a52;
            margin-top: 10px;
        }

        /* Scrapbook-style photo grid */
        .photos {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 18px 16px;
            max-width: 700px;
            margin: 20px auto 0;
            padding: 10px 16px;
        }

        .polaroid {
            background: #fff8ef;
            padding: 10px 10px 24px;
            border-radius: 4px;
            box-shadow: 0 8px 18px rgba(92, 68, 51, 0.25);
            position: relative;
            width: calc(50% - 8px);
            max-width: 160px;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            cursor: pointer;
        }

        @media (min-width: 420px) {
            .polaroid {
                width: calc(33.333% - 11px);
            }
        }

        @media (min-width: 640px) {
            .polaroid {
                width: 150px;
            }
        }

        .polaroid:nth-child(4n+1) { transform: rotate(-4deg); }
        .polaroid:nth-child(4n+2) { transform: rotate(3deg); }
        .polaroid:nth-child(4n+3) { transform: rotate(-2deg); }
        .polaroid:nth-child(4n+4) { transform: rotate(4deg); }

        .polaroid:hover {
            transform: rotate(0deg) scale(1.05);
            box-shadow: 0 16px 32px rgba(92, 68, 51, 0.35);
            z-index: 5;
        }

        .polaroid img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;
            border-radius: 2px;
        }

        .polaroid::before {
            content: "";
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%) rotate(-3deg);
            width: 60px;
            height: 22px;
            background: rgba(217, 183, 138, 0.55);
            border: 1px solid rgba(161, 122, 82, 0.3);
        }

        /* Lightbox (tap to enlarge) */
        #lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }

        #lightbox img {
            max-width: 100%;
            max-height: 100%;
            border-radius: 12px;
        }

        /* Decorative back button */
        .back {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: fit-content;
            margin: 40px auto 50px;
            padding: 12px 28px;
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 1.1rem;
            letter-spacing: 1px;
            color: #5C4433;
            text-decoration: none;
            background: #fbe9d3;
            border: 1px solid #d9b78a;
            border-radius: 999px;
            box-shadow: 0 6px 16px rgba(92, 68, 51, 0.18);
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        .back::before {
            content: "←";
            font-style: normal;
        }

        .back:hover {
            background: #fff3e2;
            transform: translateY(-2px);
            box-shadow: 0 10px 22px rgba(92, 68, 51, 0.25);
        }

        .back:active {
            transform: scale(0.96);
            box-shadow: 0 3px 8px rgba(92, 68, 51, 0.2);
        }
    </style>
</head>

<body>

    <header>
        <img src="Sokay.png" alt="Sokay">
    </header>

    <h1>21.09.26</h1>

    <div class="photos">
        <div class="polaroid"><img src="a.png" alt="Photo 1" onclick="openLightbox(this.src)"></div>
        <div class="polaroid"><img src="c.png" alt="Photo 2" onclick="openLightbox(this.src)"></div>
        <div class="polaroid"><img src="b.png" alt="Photo 3" onclick="openLightbox(this.src)"></div>
        <div class="polaroid"><img src="d.jpeg" alt="Photo 4" onclick="openLightbox(this.src)"></div>
        <div class="polaroid"><img src="5.png" alt="Photo 5" onclick="openLightbox(this.src)"></div>
        <div class="polaroid"><img src="6.png" alt="Photo 6" onclick="openLightbox(this.src)"></div>
        <div class="polaroid"><img src="7.png" alt="Photo 7" onclick="openLightbox(this.src)"></div>
        <div class="polaroid"><img src="8.png" alt="Photo 8" onclick="openLightbox(this.src)"></div>
        <div class="polaroid"><img src="9.png" alt="Photo 9" onclick="openLightbox(this.src)"></div>
        <div class="polaroid"><img src="10.png" alt="Photo 10" onclick="openLightbox(this.src)"></div>
    </div>

    <a class="back" href="index.html">Back</a>

    <div id="lightbox" onclick="this.style.display='none'">
        <img id="lightboxImg" src="">
    </div>

    <script>
        function openLightbox(src) {
            document.getElementById('lightboxImg').src = src;
            document.getElementById('lightbox').style.display = 'flex';
        }
    </script>

</body>
</html>
